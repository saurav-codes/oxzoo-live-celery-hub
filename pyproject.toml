[project]
name = "celery-hub"
version = "1.0.0"
description = "oxzoo-live celery-hub: Django 5 + gunicorn with a Celery worker and beat"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=5.2,<6",
    "gunicorn>=23",
    "celery[redis]>=5.5",
    "redis>=5",
    "psycopg[binary]>=3.2",
    "dj-database-url>=2.3",
    "whitenoise>=6.8",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-django>=4.9"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
DJANGO_SETTINGS_MODULE = "hub.settings"
